<!doctype html>
<html lang="mn"><head><meta charset="utf-8"><title>Font check</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&family=Inter+Tight:wght@400;600&family=Manrope:wght@400;600&family=Montserrat:wght@400;600&display=swap">
<style>
body{background:#060606;color:#f2f1ee;margin:24px;font-size:16px}
section{border-top:1px solid #333;padding:14px 0}
h2{font:500 12px monospace;color:#888;margin:0 0 8px}
.big{font-size:44px;font-weight:600;line-height:1.2}
.p{color:#a4a39f;margin-top:6px}
</style></head><body>
<script>
['Onest','Inter Tight','Manrope','Montserrat'].forEach(f=>document.write(`<section style="font-family:'${f}'"><h2>${f}</h2>
<div class="big">Шинэ үеийн BYD автомашинуудыг өөрийн биеэр туршаарай.</div>
<div class="p">Өдөрлөгийн хөтөлбөр · Гэр бүлээрээ · Үзэсгэлэн · ӨӨ ҮҮ өө үү · Цамбагаравын баруун урд · 2026.10.03 · 11:00–13:00</div>
<div class="p" style="font-weight:600;letter-spacing:.08em">TEST DRIVE-Д БҮРТГҮҮЛЭХ · БҮРТГЭЛ БАТАЛГААЖУУЛАХ · ӨДӨРЛӨГ</div></section>`));
</script></body></html>
